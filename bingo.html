<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f6f1">
  <title>Borus Bingo · Meeting edition</title>
  <link rel="stylesheet" href="assets/bingo.css">
  <script src="assets/bingo.js" defer></script>
</head>
<body>
  <main class="wrap">
    <section class="game" aria-label="Borus Bingo game">
      <div class="game-toolbar">
        <div class="board-label"><span aria-hidden="true">▦</span> Your bingo card <span class="card-tag">LET’S PLAY</span></div>
        <div class="actions">
          <button id="clearBtn" class="clear-button" type="button">Clear marks</button>
          <button id="reshuffleBtn" class="shuffle-button" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 6h3c5 0 7 12 12 12h3m-4-4 4 4-4 4M3 18h3c2 0 4-3 6-6s4-6 6-6h3m-4-4 4 4-4 4"/></svg> Reshuffle <span class="desktop-only">card</span></button>
        </div>
      </div>
      <div class="card">
        <div class="column-headings" aria-hidden="true"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
        <div id="board" class="board" role="group" aria-label="Bingo card. Mark five in a row, column, or diagonal."></div>
      </div>
    </section>
    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
  </main>
  <div id="celebration" class="celebration" role="status" aria-live="polite" aria-atomic="true" hidden><span class="celebration-icon" aria-hidden="true">✳</span><div><strong>BINGO!</strong><span id="celebrationMessage">A meeting well spent.</span></div><button id="dismissCelebration" type="button" aria-label="Dismiss bingo celebration">×</button></div>
  <div id="confetti" class="confetti" aria-hidden="true"></div>
</body>
</html>
